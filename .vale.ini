# Vale prose lint for the docs site (issue #205). Advisory only: CI does not
# run it, and nothing here blocks a merge. Run it by hand on a page you edit:
#   vale docs/path/to/page.md
#
# Only Vale's built-in style is used, so no `vale sync` step is needed.
MinAlertLevel = warning

[*.md]
BasedOnStyles = Vale
# Product names, hostnames and tool names trip the spelling rule on almost
# every line; it is noise until the project has its own vocabulary file.
Vale.Spelling = NO
